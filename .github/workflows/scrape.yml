name: scrape-prices

on:
  schedule:
    # Full catalogue: every night ~02:17 Riyadh time (23:17 UTC)
    - cron: "17 23 * * *"
    # Quick price refresh of watched items: hourly 07:23–00:23 Riyadh (04–21 UTC)
    - cron: "23 4-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | quick | match"
        default: "quick"
      stores:
        description: "comma separated"
        default: "tamimi,panda,lulu,danube"

concurrency:
  group: scrape-${{ github.event.schedule || github.event.inputs.mode }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  full:
    if: github.event.schedule == '17 23 * * *' || github.event.inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        store: [tamimi, panda, lulu, danube]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - if: matrix.store == 'danube' && (github.event_name != 'workflow_dispatch' || contains(github.event.inputs.stores, matrix.store))
        run: python -m playwright install --with-deps chromium
      - name: crawl ${{ matrix.store }}
        # on a manual run, only the stores typed in "stores" are crawled
        if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.stores, matrix.store)
        run: python -m scraper.run full --stores ${{ matrix.store }}
      - name: keep debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.store }}
          path: out/
          if-no-files-found: ignore

  match:
    needs: full
    if: always() && needs.full.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m scraper.run match

  quick:
    if: github.event.schedule == '23 4-21 * * *' || github.event.inputs.mode == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m scraper.run quick --stores ${{ github.event.inputs.stores || 'tamimi,panda,lulu,danube' }}
